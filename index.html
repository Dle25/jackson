<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>dle tra deadline</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container">
      <div class="header-box">
        <div class="title">Jackson</div>
        <div class="divider"></div>
        <div class="title">Electronics</div>
      </div>

      <h2 class="form-title">Registration Form</h2>
      <form>
        <table class="form-table">
          <caption>Register your Jackson Electronics product here</caption>
          <tr>
            <td>First Name:</td>
            <td><input type="text" name="firstname"></td>
            <td>Last Name:</td>
            <td><input type="text" name="lastname"></td>
          </tr>
          <tr>
            <td>Address #1:</td>
            <td colspan="3"><input type="text" name="address1" size="40"></td>
          </tr>
          <tr>
            <td>Address #2:</td>
            <td colspan="3"><input type="text" name="address2" size="40"></td>
          </tr>
          <tr>
            <td>City:</td>
            <td><input type="text" name="city"></td>
            <td>State:</td>
            <td><input type="text" name="state" size="10"></td>
          </tr>
          <tr>
            <td>Zip:</td>
            <td><input type="text" name="zip" size="10"></td>
            <td>Country:</td>
            <td><input type="text" name="country" value="United States"></td>
          </tr>

          <tr><td colspan="4"><hr></td></tr>
          <tr>
            <td>Product</td>
            <td colspan="3">
              <select id="product" class="product-select">
                <option value="ScanMaster">ScanMaster</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
              </select>
            </td>
          </tr>
          <tr>
            <td>Date Purchased</td>
            <td colspan="3"><input type="date" id="date" class="date-input"></td>
          </tr>
          <tr>
            <td>Serial #</td>
            <td colspan="3"><input type="text" id="serial" class="serial-input"></td>
          </tr>
          <tr>
            <td>Used for</td>
            <td colspan="3">
              <table>
                <tr>
                  <td><label><input type="radio" name="used" value="Home"> Home</label></td>
                  <td><label><input type="radio" name="used" value="Business"> Business</label></td>
                </tr>
                <tr>
                  <td><label><input type="radio" name="used" value="Government"> Government</label></td>
                  <td><label><input type="radio" name="used" value="Educational"> Educational Institution</label></td>
                </tr>
                <tr>
                  <td><label><input type="radio" name="used" value="Other"> Other</label></td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td>System (check all that apply):</td>
            <td colspan="3">
              <table>
                <tr>
                  <td><label><input type="checkbox" name="sys" value="Windows"> Windows</label></td>
                  <td><label><input type="checkbox" name="sys" value="Macintosh"> Macintosh</label></td>
                </tr>
                <tr>
                  <td><label><input type="checkbox" name="sys" value="UNIX"> UNIX</label></td>
                  <td><label><input type="checkbox" name="sys" value="Other"> Other</label></td>
                </tr>
              </table>
            </td>
          </tr>

          <tr><td colspan="4"><hr></td></tr>
          <tr>
            <td>Comments?:</td>
            <td colspan="3"><textarea id="comments"></textarea></td>
          </tr>
          <tr>
            <td colspan="4" style="text-align:center;">
              <input type="submit" value="Click to register" class="btn">
              <input type="reset" value="Click to cancel" class="btn ml-1">
            </td>
          </tr>
        </table>
      </form>
    </div>
  </body>
</html>
