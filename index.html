<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>dle tra deadline</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container">
      <div class="header-box">
        <div class="title">Jackson</div>
        <div class="divider"></div>
        <div class="title">Electronics</div>
      </div>

      <h2 class="form-title">Registration Form</h2>
      <form>
        <table class="form-table">
          <caption>Register your Jackson Electronics product here</caption>
          <tr>
            <td>First Name</td>
            <td>
              <input type="text" id="fname">
              <label>Last Name: </label>
              <input type="text" id="lname">
            </td>
          </tr>
          <tr>
            <td>Address #1</td>
            <td>
              <input type="text" id="address1" class="wide-input">
            </td>
          </tr>
          <tr>
            <td>Address #2</td>
            <td>
              <input type="text" id="address2" class="wide-input">
            </td>
          </tr>
          <tr>
            <td>City</td>
            <td>
              <input type="text" class="city-input">
              <label>State:</label>
              <input type="text" id="state" class="state-input">
              <label>Zip:</label>
              <input type="text" id="zip" class="zip-input">
            </td>
          </tr>
          <tr>
            <td>Country</td>
            <td>
              <input type="text" id="country" value="United States">
            </td>
          </tr>
          <tr><td colspan="2"><hr></td></tr>
          <tr>
            <td>Product</td>
            <td>
              <select id="product" class="product-select">
                <option value="ScanMaster">ScanMaster</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
              </select>
            </td>
          </tr>
          <tr>
            <td>Date Purchased</td>
            <td>
              <input type="date" id="date" class="date-input">
            </td>
          </tr>
          <tr>
            <td>Serial #</td>
            <td>
              <input type="text" id="serial" class="serial-input">
            </td>
          </tr>
          <tr>
            <td>Used for</td>
            <td>
              <input type="radio" id="home" name="used"><label>Home</label>
              <input type="radio" id="educational_instituntion" name="used" class="ml-17"><label>Educational Institution</label>
            </td>
          </tr>
          <tr>
            <td></td>
            <td>
              <input type="radio" id="business" name="used"><label>Business</label>
              <input type="radio" id="other" name="used" class="ml-13"><label>Other</label>
            </td>
          </tr>
          <tr>
            <td></td>
            <td>
              <input type="radio" id="governmment" name="used"><label>Government</label>
            </td>
          </tr>
          <tr>
            <td class="system-label">System (check all that apply):</td>
            <td>
              <input type="checkbox" id="windows"><label>Windows</label>
              <input type="checkbox" id="unix" class="ml-12"><label>UNIX</label>
            </td>
          </tr>
          <tr>
            <td></td>
            <td>
              <input type="checkbox" id="macintosh"><label>Macintosh</label>
              <input type="checkbox" id="other" class="ml-10"><label>Other</label>
            </td>
          </tr>
          <tr><td colspan="2"><hr></td></tr>
          <tr>
            <td><label>Comments?:</label></td>
            <td>
              <textarea id="comments"></textarea>
            </td>
          </tr>
          <tr>
            <td colspan="2">
              <input type="submit" value="Click to register" class="btn">
              <input type="submit" value="Click to cancel" class="btn ml-1">
            </td>
          </tr>
        </table>
      </form>
    </div>
  </body>
</html>
